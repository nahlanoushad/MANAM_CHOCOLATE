<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <radialGradient id="bgInd" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d1b24"/>
      <stop offset="50%" stop-color="#281017"/>
      <stop offset="100%" stop-color="#14060b"/>
    </radialGradient>
    <radialGradient id="bonbon1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a6384a"/>
      <stop offset="60%" stop-color="#5e1c28"/>
      <stop offset="100%" stop-color="#2b0a11"/>
    </radialGradient>
    <radialGradient id="bonbon2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d49b4d"/>
      <stop offset="50%" stop-color="#8c5820"/>
      <stop offset="100%" stop-color="#3b2006"/>
    </radialGradient>
    <radialGradient id="bonbon3" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4e6d54"/>
      <stop offset="60%" stop-color="#283d2d"/>
      <stop offset="100%" stop-color="#111c13"/>
    </radialGradient>
    <filter id="bonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgInd)"/>

  <!-- Presentation Slate Tray -->
  <g filter="url(#bonShadow)">
    <rect x="220" y="190" width="560" height="230" rx="14" fill="#1b1115" stroke="#3d212b" stroke-width="2"/>
    <rect x="235" y="205" width="530" height="200" rx="10" fill="#24161c" stroke="#321b24" stroke-width="1"/>
  </g>

  <!-- Bonbon Jewels -->
  <!-- Bonbon 1 (Ruby / Berry) -->
  <g filter="url(#bonShadow)">
    <circle cx="340" cy="305" r="50" fill="url(#bonbon1)"/>
    <path d="M315,280 Q345,265 365,285" stroke="#ff8da1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Bonbon 2 (Caramel / Gold) -->
  <g filter="url(#bonShadow)">
    <rect x="455" y="260" width="90" height="90" rx="20" fill="url(#bonbon2)"/>
    <path d="M470,285 Q500,270 530,290" stroke="#ffe0a3" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="500" cy="305" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Bonbon 3 (Pistachio / Forest) -->
  <g filter="url(#bonShadow)">
    <circle cx="660" cy="305" r="50" fill="url(#bonbon3)"/>
    <path d="M635,280 Q665,265 685,285" stroke="#a7dbae" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <text x="500" y="525" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="0.25em" fill="#d4a359" text-anchor="middle" text-transform="uppercase">ARTISANAL BONBONS &amp; PALETTES</text>
</svg>