<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="hydBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="50%" stop-color="#361b0e"/>
      <stop offset="100%" stop-color="#140804"/>
    </linearGradient>
    <radialGradient id="hydGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#hydBg)"/>
  <circle cx="600" cy="400" r="450" fill="url(#hydGlow)"/>

  <!-- Karkhana Classroom / Laboratory Architecture Motif -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <line x1="200" y1="260" x2="1000" y2="260"/>
    <line x1="200" y1="640" x2="1000" y2="640"/>
    <line x1="600" y1="260" x2="600" y2="640"/>
  </g>

  <!-- Melanger / Tempering Vat Silhouettes -->
  <circle cx="430" cy="450" r="110" fill="#29140a" stroke="#542e18" stroke-width="2"/>
  <circle cx="770" cy="450" r="110" fill="#29140a" stroke="#542e18" stroke-width="2"/>
  <circle cx="430" cy="450" r="40" fill="#170a04"/>
  <circle cx="770" cy="450" r="40" fill="#170a04"/>

  <!-- Typography & Badge -->
  <text x="600" y="190" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="6" fill="#ffffff">WORKSHOPS · HYDERABAD</text>
  <text x="600" y="230" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#d4af37" text-transform="uppercase">Manam Chocolate Karkhana, Banjara Hills</text>
  <text x="600" y="720" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" letter-spacing="2" fill="#9c8270" text-transform="uppercase">Live Factory Classroom · Bean to Bar Immersion · Tasting Flights</text>
</svg>