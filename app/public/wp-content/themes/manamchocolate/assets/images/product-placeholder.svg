<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="plBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FCFAF8"/>
      <stop offset="60%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#ECE5DE"/>
    </radialGradient>
    <linearGradient id="plBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B2C1C"/>
      <stop offset="100%" stop-color="#2B160C"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#B3843C"/>
    </linearGradient>
    <filter id="plShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#3A2315" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#plBg)"/>

  <!-- Subtle Decorative Border -->
  <rect x="24" y="24" width="752" height="952" fill="none" stroke="#E5DCD3" stroke-width="1"/>

  <!-- Organic Botanical Pod Line Art (Background Watermark) -->
  <g opacity="0.12" stroke="#2B160C" stroke-width="2" fill="none" transform="translate(400, 480) scale(1.4)">
    <path d="M0 -150 C70 -120 110 -40 110 40 C110 120 60 170 0 200 C-60 170 -110 120 -110 40 C-110 -40 -70 -120 0 -150 Z"/>
    <path d="M0 -150 C25 -100 40 -20 40 40 C40 100 20 160 0 200"/>
    <path d="M0 -150 C-25 -100 -40 -20 -40 40 C-40 100 -20 160 0 200"/>
    <line x1="0" y1="-150" x2="0" y2="200"/>
  </g>

  <!-- Central Chocolate Tablet Graphic -->
  <g transform="translate(260, 310)" filter="url(#plShadow)">
    <!-- Base Bar -->
    <rect width="280" height="380" rx="8" fill="url(#plBar)" stroke="#5B3622" stroke-width="2"/>
    
    <!-- Elegant Grid of Chocolate Squares -->
    <g fill="#371E11" stroke="#54301D" stroke-width="1.5">
      <!-- Row 1 -->
      <rect x="24" y="28" width="68" height="92" rx="4"/>
      <rect x="106" y="28" width="68" height="92" rx="4"/>
      <rect x="188" y="28" width="68" height="92" rx="4"/>
      
      <!-- Row 2 -->
      <rect x="24" y="144" width="68" height="92" rx="4"/>
      <rect x="106" y="144" width="68" height="92" rx="4"/>
      <rect x="188" y="144" width="68" height="92" rx="4"/>

      <!-- Row 3 -->
      <rect x="24" y="260" width="68" height="92" rx="4"/>
      <rect x="106" y="260" width="68" height="92" rx="4"/>
      <rect x="188" y="260" width="68" height="92" rx="4"/>
    </g>

    <!-- Embossed Cacao Monogram / Leaf in Center Square -->
    <path d="M140, 172 C148, 180 152, 192 148, 202 C144, 210 136, 214 132, 212 C126, 208 126, 196 130, 188 Z" fill="url(#goldAccent)" opacity="0.85"/>
  </g>

  <!-- Brand Typography -->
  <text x="400" y="780" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" letter-spacing="6" fill="#4B2C1C" font-weight="600">MANAM</text>
  <text x="400" y="805" text-anchor="middle" font-family="'Merriweather Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" letter-spacing="3" fill="#8C7060" text-transform="uppercase">CRAFT CHOCOLATE</text>
</svg>

