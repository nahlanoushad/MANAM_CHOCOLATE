<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000">
  <defs>
    <radialGradient id="cafeBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4F362A"/>
      <stop offset="50%" stop-color="#321F17"/>
      <stop offset="100%" stop-color="#140A06"/>
    </radialGradient>
    <linearGradient id="pendantGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFA726" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1000" fill="url(#cafeBg)"/>

  <!-- Architectural Background Windows / Arches -->
  <g fill="#23150F" stroke="#3D271D" stroke-width="2">
    <path d="M200,600 L200,300 Q350,150 500,300 L500,600 Z"/>
    <path d="M600,600 L600,300 Q750,150 900,300 L900,600 Z"/>
    <path d="M1100,600 L1100,300 Q1250,150 1400,300 L1400,600 Z"/>
    <path d="M1500,600 L1500,300 Q1650,150 1800,300 L1800,600 Z"/>
  </g>

  <!-- Flooring -->
  <rect y="680" width="2000" height="320" fill="#1A110B"/>
  <line x1="0" y1="680" x2="2000" y2="680" stroke="#382419" stroke-width="2"/>

  <!-- Hanging Minimalist Pendant Lights with Conical Glow -->
  <g>
    <!-- Pendant 1 -->
    <line x1="380" y1="0" x2="380" y2="280" stroke="#8A654C" stroke-width="2"/>
    <polygon points="360,280 400,280 415,310 345,310" fill="#B3843C"/>
    <polygon points="345,310 415,310 520,700 240,700" fill="url(#pendantGlow)"/>

    <!-- Pendant 2 -->
    <line x1="820" y1="0" x2="820" y2="240" stroke="#8A654C" stroke-width="2"/>
    <polygon points="800,240 840,240 855,270 785,270" fill="#B3843C"/>
    <polygon points="785,270 855,270 960,700 680,700" fill="url(#pendantGlow)"/>

    <!-- Pendant 3 -->
    <line x1="1280" y1="0" x2="1280" y2="280" stroke="#8A654C" stroke-width="2"/>
    <polygon points="1260,280 1300,280 1315,310 1245,310" fill="#B3843C"/>
    <polygon points="1245,310 1315,310 1420,700 1140,700" fill="url(#pendantGlow)"/>

    <!-- Pendant 4 -->
    <line x1="1680" y1="0" x2="1680" y2="240" stroke="#8A654C" stroke-width="2"/>
    <polygon points="1660,240 1700,240 1715,270 1645,270" fill="#B3843C"/>
    <polygon points="1645,270 1715,270 1820,700 1540,700" fill="url(#pendantGlow)"/>
  </g>

  <!-- Café Tables & Curved Chairs -->
  <!-- Table 1 (Left) -->
  <g transform="translate(320, 620)">
    <ellipse cx="60" cy="50" rx="90" ry="24" fill="#5A3A29" stroke="#7A5039" stroke-width="2"/>
    <rect x="54" y="74" width="12" height="130" fill="#2E1C13"/>
    <ellipse cx="60" cy="204" rx="45" ry="12" fill="#1C100A"/>
  </g>

  <!-- Table 2 (Center) -->
  <g transform="translate(760, 600)">
    <ellipse cx="60" cy="50" rx="100" ry="26" fill="#69432F" stroke="#8A583E" stroke-width="2"/>
    <rect x="54" y="76" width="12" height="150" fill="#2E1C13"/>
    <ellipse cx="60" cy="226" rx="50" ry="14" fill="#1C100A"/>
    <!-- Hot Chocolate Cups -->
    <rect x="35" y="30" width="18" height="16" rx="2" fill="#EADCCF"/>
    <rect x="70" y="30" width="18" height="16" rx="2" fill="#EADCCF"/>
  </g>

  <!-- Table 3 (Right) -->
  <g transform="translate(1220, 620)">
    <ellipse cx="60" cy="50" rx="90" ry="24" fill="#5A3A29" stroke="#7A5039" stroke-width="2"/>
    <rect x="54" y="74" width="12" height="130" fill="#2E1C13"/>
    <ellipse cx="60" cy="204" rx="45" ry="12" fill="#1C100A"/>
  </g>

  <!-- Editorial Badge Watermark -->
  <g transform="translate(1680, 880)" opacity="0.85">
    <rect width="240" height="60" rx="4" fill="#000000" fill-opacity="0.5"/>
    <text x="120" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" letter-spacing="3" fill="#D6CBC1" text-transform="uppercase">03 / EXPERIENTIAL CAFÉ</text>
  </g>
</svg>

