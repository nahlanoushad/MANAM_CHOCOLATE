<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1009"/>
      <stop offset="50%" stop-color="#2f1a0e"/>
      <stop offset="100%" stop-color="#120804"/>
    </linearGradient>
    <radialGradient id="tourGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9933b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#tourBg)"/>
  <circle cx="600" cy="400" r="450" fill="url(#tourGlow)"/>

  <!-- Tour Compass & Factory Blueprint Silhouette -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <circle cx="600" cy="400" r="200"/>
    <circle cx="600" cy="400" r="260"/>
    <line x1="200" y1="400" x2="1000" y2="400"/>
    <line x1="600" y1="120" x2="600" y2="680"/>
  </g>

  <text x="600" y="240" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="6" fill="#ffffff">KARKHANA TOURS</text>
  <text x="600" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#d4af37" text-transform="uppercase">10,000 Sq. Ft. Immersive Factory Space</text>
  <text x="600" y="415" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="18" letter-spacing="4" fill="#eed9c4">EXPERIENCE THE BEAT OF CHOCOLATE MAKING</text>
  <text x="600" y="580" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" letter-spacing="2" fill="#a89282" text-transform="uppercase">Banjara Hills, Hyderabad · Roasting to Conching to Chocolatiering</text>
</svg>