<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <radialGradient id="skyGrad" cx="60%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#fdf4e7"/>
      <stop offset="35%" stop-color="#fae7cc"/>
      <stop offset="70%" stop-color="#ecd3b0"/>
      <stop offset="100%" stop-color="#d6b68a"/>
    </radialGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e2c1a"/>
      <stop offset="50%" stop-color="#361c0e"/>
      <stop offset="100%" stop-color="#1f0f06"/>
    </linearGradient>
    <linearGradient id="podGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="50%" stop-color="#b85c1e"/>
      <stop offset="100%" stop-color="#6e2e0e"/>
    </linearGradient>
  </defs>

  <!-- Sky / Farm Landscape Background -->
  <rect width="1600" height="1200" fill="url(#skyGrad)"/>

  <!-- Distant Godavari River & Hills -->
  <path d="M0,720 Q300,640 700,690 T1600,630 L1600,1200 L0,1200 Z" fill="#cbb38f" opacity="0.45"/>
  <path d="M0,780 Q450,710 900,770 T1600,720 L1600,1200 L0,1200 Z" fill="#b0936e" opacity="0.6"/>

  <!-- Soil / Earth Foreground -->
  <path d="M0,860 Q500,810 1000,870 T1600,820 L1600,1200 L0,1200 Z" fill="url(#earthGrad)"/>

  <!-- Botanical Cacao Canopy (Trunk & Branches) -->
  <g stroke="#3a2012" stroke-linecap="round" fill="none">
    <!-- Main Tree Trunk -->
    <path d="M380,1200 Q400,900 360,700 Q330,550 240,400" stroke-width="70"/>
    <path d="M360,700 Q480,560 620,440" stroke-width="45"/>
    <path d="M480,560 Q560,420 540,280" stroke-width="32"/>
    <path d="M280,480 Q180,360 120,240" stroke-width="28"/>
  </g>

  <!-- Cacao Leaves -->
  <g fill="#4a5d3c" opacity="0.85">
    <ellipse cx="210" cy="360" rx="75" ry="32" transform="rotate(-30 210 360)"/>
    <ellipse cx="320" cy="320" rx="85" ry="36" transform="rotate(-15 320 320)"/>
    <ellipse cx="500" cy="380" rx="90" ry="38" transform="rotate(25 500 380)"/>
    <ellipse cx="610" cy="340" rx="80" ry="34" transform="rotate(40 610 340)"/>
    <ellipse cx="560" cy="240" rx="70" ry="30" transform="rotate(-20 560 240)"/>
    <ellipse cx="140" cy="220" rx="75" ry="32" transform="rotate(45 140 220)"/>
    <ellipse cx="400" cy="210" rx="85" ry="35" transform="rotate(10 400 210)"/>
  </g>

  <!-- Golden & Crimson Cacao Pods Growing on Trunk -->
  <g>
    <!-- Pod 1 -->
    <path d="M360,650 C300,680 290,780 340,840 C380,880 430,830 420,740 C410,670 380,640 360,650 Z" fill="url(#podGold)" stroke="#4a220a" stroke-width="3"/>
    <path d="M325,720 Q365,770 385,830" stroke="#fce4b8" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- Pod 2 -->
    <path d="M420,530 C380,550 370,620 410,660 C440,690 470,660 470,600 C470,550 440,520 420,530 Z" fill="url(#podGold)" stroke="#4a220a" stroke-width="3"/>
    <!-- Pod 3 -->
    <path d="M270,540 C230,560 230,620 260,660 C290,690 320,660 320,600 C320,550 290,530 270,540 Z" fill="#8c2e17" stroke="#4a220a" stroke-width="3"/>
  </g>

  <!-- West Godavari Sunbeams -->
  <g stroke="#fff2dc" stroke-width="2" opacity="0.25">
    <line x1="800" y1="0" x2="600" y2="1200"/>
    <line x1="1000" y1="0" x2="750" y2="1200"/>
    <line x1="1200" y1="0" x2="900" y2="1200"/>
    <line x1="1400" y1="0" x2="1100" y2="1200"/>
  </g>
</svg>