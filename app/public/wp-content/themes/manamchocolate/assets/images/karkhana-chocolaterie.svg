<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="2000" height="1000">
  <defs>
    <radialGradient id="chocLabBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#3D291F"/>
      <stop offset="60%" stop-color="#241710"/>
      <stop offset="100%" stop-color="#120A06"/>
    </radialGradient>
    <linearGradient id="marbleSlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE8"/>
      <stop offset="50%" stop-color="#DFD7D1"/>
      <stop offset="100%" stop-color="#C7BBB3"/>
    </linearGradient>
    <linearGradient id="liquidChoc" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3A1D11"/>
      <stop offset="50%" stop-color="#220F08"/>
      <stop offset="100%" stop-color="#120603"/>
    </linearGradient>
  </defs>

  <rect width="2000" height="1000" fill="url(#chocLabBg)"/>

  <!-- Back Laboratory Stainless Equipment Silhouettes -->
  <g fill="#1E130D" stroke="#362217" stroke-width="2">
    <rect x="250" y="200" width="300" height="420" rx="4"/>
    <rect x="620" y="240" width="240" height="380" rx="4"/>
    <rect x="1440" y="180" width="320" height="440" rx="4"/>
  </g>

  <!-- Large Glass Observation Window Frame (Separating guests from kitchen) -->
  <line x1="0" y1="120" x2="2000" y2="120" stroke="#3B261A" stroke-width="3"/>
  <line x1="500" y1="120" x2="500" y2="650" stroke="#3B261A" stroke-width="2"/>
  <line x1="1000" y1="120" x2="1000" y2="650" stroke="#3B261A" stroke-width="2"/>
  <line x1="1500" y1="120" x2="1500" y2="650" stroke="#3B261A" stroke-width="2"/>

  <!-- Central Marble Tempering Table -->
  <g transform="translate(480, 560)">
    <!-- Slab Base Stand -->
    <rect x="80" y="120" width="880" height="240" rx="4" fill="#2E1D14" stroke="#482E20" stroke-width="2"/>
    <!-- Top Italian Marble Slab -->
    <polygon points="40,20 1000,20 1040,120 0,120" fill="url(#marbleSlab)" stroke="#B3A59B" stroke-width="2"/>
    <!-- Marble Veins -->
    <path d="M120,60 Q300,90 460,40 T800,80" stroke="#9A8B80" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M220,100 Q400,50 620,110 T950,50" stroke="#9A8B80" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- Flowing Tempered Chocolate Pool & Palette Knife Action -->
    <!-- Chocolate Pool -->
    <path d="M240,65 Q380,45 560,55 Q720,65 800,85 Q680,105 500,100 Q320,105 240,65 Z" fill="url(#liquidChoc)" stroke="#452417" stroke-width="1.5"/>
    <ellipse cx="520" cy="78" rx="140" ry="20" fill="#4B2717" opacity="0.4"/>
    
    <!-- Chocolatier Scraper / Spatula -->
    <g transform="translate(460, -40) rotate(25)">
      <polygon points="0,0 120,0 115,100 5,100" fill="#D1C7BD" stroke="#8C7D73" stroke-width="2"/>
      <rect x="45" y="-90" width="30" height="90" rx="4" fill="#523423"/>
    </g>

    <!-- Assorted Bonbon Molds & Art Pieces -->
    <g transform="translate(60, 40)">
      <rect width="120" height="60" rx="3" fill="#D6CDC5" opacity="0.7"/>
      <circle cx="20" cy="20" r="10" fill="#2E170E"/>
      <circle cx="50" cy="20" r="10" fill="#2E170E"/>
      <circle cx="80" cy="20" r="10" fill="#2E170E"/>
      <circle cx="20" cy="42" r="10" fill="#2E170E"/>
      <circle cx="50" cy="42" r="10" fill="#2E170E"/>
      <circle cx="80" cy="42" r="10" fill="#2E170E"/>
    </g>
  </g>

  <!-- Editorial Badge Watermark -->
  <g transform="translate(1680, 880)" opacity="0.85">
    <rect width="240" height="60" rx="4" fill="#000000" fill-opacity="0.5"/>
    <text x="120" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" letter-spacing="3" fill="#D6CBC1" text-transform="uppercase">04 / CHOCOLATERIE</text>
  </g>
</svg>

