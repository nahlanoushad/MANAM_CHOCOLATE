<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 548" width="780" height="548">
  <defs>
    <radialGradient id="skyGradM" cx="60%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#fdf4e7"/>
      <stop offset="50%" stop-color="#fae7cc"/>
      <stop offset="100%" stop-color="#d6b68a"/>
    </radialGradient>
    <linearGradient id="earthGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e2c1a"/>
      <stop offset="100%" stop-color="#1f0f06"/>
    </linearGradient>
    <linearGradient id="podGoldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="50%" stop-color="#b85c1e"/>
      <stop offset="100%" stop-color="#6e2e0e"/>
    </linearGradient>
  </defs>

  <rect width="780" height="548" fill="url(#skyGradM)"/>

  <!-- Hills -->
  <path d="M0,340 Q200,300 450,330 T780,290 L780,548 L0,548 Z" fill="#b0936e" opacity="0.6"/>
  <path d="M0,380 Q250,350 500,390 T780,360 L780,548 L0,548 Z" fill="url(#earthGradM)"/>

  <!-- Tree & Pods -->
  <g stroke="#3a2012" stroke-linecap="round" fill="none">
    <path d="M260,548 Q280,420 240,300 Q210,200 140,110" stroke-width="45"/>
    <path d="M240,300 Q340,210 440,140" stroke-width="30"/>
  </g>

  <g fill="#4a5d3c" opacity="0.85">
    <ellipse cx="140" cy="110" rx="55" ry="24" transform="rotate(-30 140 110)"/>
    <ellipse cx="260" cy="180" rx="60" ry="26" transform="rotate(15 260 180)"/>
    <ellipse cx="380" cy="160" rx="58" ry="25" transform="rotate(35 380 160)"/>
  </g>

  <!-- Cacao Pods -->
  <g>
    <path d="M240,280 C200,300 190,370 230,410 C260,440 290,400 280,340 Z" fill="url(#podGoldM)" stroke="#4a220a" stroke-width="2"/>
    <path d="M280,220 C250,230 250,280 270,300 C290,320 310,300 310,260 Z" fill="#8c2e17" stroke="#4a220a" stroke-width="2"/>
  </g>
</svg>