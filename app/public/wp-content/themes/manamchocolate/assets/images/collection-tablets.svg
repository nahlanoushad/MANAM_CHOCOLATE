<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <radialGradient id="bgTab" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d261b"/>
      <stop offset="50%" stop-color="#28160e"/>
      <stop offset="100%" stop-color="#140b07"/>
    </radialGradient>
    <linearGradient id="tabDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c170e"/>
      <stop offset="100%" stop-color="#180b06"/>
    </linearGradient>
    <linearGradient id="tabMilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3928"/>
      <stop offset="100%" stop-color="#382115"/>
    </linearGradient>
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgTab)"/>

  <!-- Botanical Lines -->
  <g opacity="0.08" stroke="#d4a359" stroke-width="1.5" fill="none">
    <path d="M50,150 Q120,80 200,160 T350,120"/>
    <path d="M650,480 Q750,400 850,500 T950,450"/>
  </g>

  <!-- Left Tablet (Angled Dark Tablet) -->
  <g transform="translate(320, 150) rotate(-12)" filter="url(#tabShadow)">
    <rect width="190" height="280" rx="6" fill="url(#tabDark)" stroke="#452718" stroke-width="2"/>
    <!-- Segment Blocks -->
    <g fill="#21110a" stroke="#3b2013" stroke-width="1.5">
      <rect x="20" y="25" width="65" height="65" rx="3"/>
      <rect x="105" y="25" width="65" height="65" rx="3"/>
      <rect x="20" y="105" width="65" height="65" rx="3"/>
      <rect x="105" y="105" width="65" height="65" rx="3"/>
      <rect x="20" y="185" width="65" height="65" rx="3"/>
      <rect x="105" y="185" width="65" height="65" rx="3"/>
    </g>
  </g>

  <!-- Right Tablet (Angled Milk/Single Origin Tablet) -->
  <g transform="translate(480, 160) rotate(10)" filter="url(#tabShadow)">
    <rect width="190" height="280" rx="6" fill="url(#tabMilk)" stroke="#69432f" stroke-width="2"/>
    <g fill="#43281b" stroke="#5d3926" stroke-width="1.5">
      <rect x="20" y="25" width="65" height="65" rx="3"/>
      <rect x="105" y="25" width="65" height="65" rx="3"/>
      <rect x="20" y="105" width="65" height="65" rx="3"/>
      <rect x="105" y="105" width="65" height="65" rx="3"/>
      <rect x="20" y="185" width="65" height="65" rx="3"/>
      <rect x="105" y="185" width="65" height="65" rx="3"/>
    </g>
    <!-- Gold Foil Band Accent -->
    <rect x="0" y="140" width="190" height="35" fill="#c48b59" opacity="0.85"/>
  </g>

  <text x="500" y="535" font-family="'Instrument Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="0.25em" fill="#d4a359" text-anchor="middle" text-transform="uppercase">SINGLE-ORIGIN CRAFT TABLETS</text>
</svg>